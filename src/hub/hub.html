<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080c">
<title>Builder's Hub · Leo</title>
<link rel="icon" href="brand/mark.png">
<link rel="preload" href="brand/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";src:url("brand/archivo.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("brand/jetbrains.woff2") format("woff2");font-weight:100 800;font-display:swap}
@font-face{font-family:"Sora";src:url("brand/sora.woff2") format("woff2");font-weight:100 800;font-display:swap}
:root{--ground:#07080c;--card:#0e0f15;--raised:#15161e;--text:#f4f0e8;--body:#d6d1c7;--dim:#a6a5b4;--orange:#f85800;--orange-ink:#ff8a4c;--teal:#2fd6c5;--hairline:rgba(255,255,255,.125);--display:"Archivo",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Sora",ui-sans-serif,system-ui,sans-serif;--gutter:56px}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--text);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--orange-ink)}
.hero{min-height:420px;display:flex;flex-direction:column;justify-content:flex-end;padding:40px var(--gutter) 36px;background:#07070b url("brand/art-launch.jpg") right center/auto 100% no-repeat}
.home{position:absolute;top:24px;left:var(--gutter);display:flex;align-items:center;min-height:44px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-decoration:none}
.home:hover{color:var(--text)}
.hero h1{margin:14px 0 12px;font:700 clamp(42px,6vw,72px)/1 var(--display);letter-spacing:-.03em}
.hero p{margin:0 0 24px;max-width:500px;font-size:16px;color:var(--body)}
.who{font:400 11px/1.4 var(--mono);color:var(--dim);margin:0 0 12px;min-height:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;max-width:620px;background:var(--hairline);border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
.stat{background:#0b0c12;padding:14px 16px}
.stat b{display:block;font:600 28px/1 var(--display)}
.stat span{display:block;margin-top:7px;font:400 10px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tone-orange{color:var(--orange-ink)}.tone-teal{color:var(--teal)}
.tabs{position:sticky;top:0;z-index:3;display:flex;gap:28px;padding:0 var(--gutter);background:var(--ground);border-bottom:1px solid var(--hairline)}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;min-height:50px;padding:0 2px;color:var(--dim);font-weight:500;font-size:14px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--orange)}
main{max-width:1208px;padding:28px var(--gutter) 72px}
.view{display:flex;flex-direction:column;gap:28px}
.group{display:flex;flex-direction:column;gap:14px}
.group-title{display:flex;align-items:center;gap:10px;margin:8px 0 0;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.group-title span{color:var(--text)}
.cards{display:flex;flex-direction:column;gap:14px}
.card{scroll-margin-top:70px;display:flex;flex-direction:column;gap:18px;padding:22px 24px;background:var(--card);border:1px solid var(--hairline);border-radius:16px}
.card-here{border-color:var(--orange)}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 20px}
.card h3{flex:1 1 320px;min-width:0;margin:0;font:600 20px/1.22 var(--display);letter-spacing:-.012em}
.pill{padding:8px 11px;border:1px solid rgba(255,255,255,.2);border-radius:999px;font:500 11px/1.2 var(--mono);letter-spacing:.04em;color:var(--body)}
.pill-orange{border-color:rgba(248,88,0,.6);color:var(--orange-ink)}
.pill-teal{border-color:rgba(47,214,197,.55);color:var(--teal)}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) max-content;margin:0;padding:0;list-style:none}
.stop{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.rail{position:absolute;left:22px;right:0;top:10px;height:2px;background:rgba(255,255,255,.14)}
.rail-done{background:var(--teal)}
.dot{position:relative;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:var(--card)}
.stop-done .dot{border:0;background:#c9f4ee;color:var(--ground)}
.stop-live .dot{background:var(--teal)}
.stop-now .dot{border:5px solid #3a1a08;background:var(--orange)}
.card-active .stop-now .dot{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,88,0,.55)}70%{box-shadow:0 0 0 11px rgba(248,88,0,0)}100%{box-shadow:0 0 0 0 rgba(248,88,0,0)}}
.stop-name{font:500 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.stop-done .stop-name{color:var(--text)}.stop-now .stop-name{color:var(--orange-ink)}
.stop-date{min-height:14px;margin-top:-5px;font:400 11px/1.3 var(--mono);color:var(--dim)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 9px;border:1px solid rgba(255,255,255,.14);border-radius:10px;font-size:12px;line-height:1.35;color:var(--dim)}
.step-n{flex:none;width:18px;height:18px;border-radius:50%;background:#23242e;color:#c9c3b8;font:500 10px/18px var(--mono);text-align:center}
.step-live{border-color:rgba(47,214,197,.45);background:#10211f;color:#d8f7f3}.step-live .step-n{background:var(--teal);color:var(--ground)}
.step-now{border-color:rgba(248,88,0,.6);background:#23130a;color:#ffd9c4}.step-now .step-n{background:var(--orange);color:#fff}
.note{margin:0;padding:12px 14px;background:var(--raised);border-radius:10px;font-size:13px;color:var(--body)}
.words summary{cursor:pointer;min-height:24px;font-size:13px;color:var(--dim)}
.words summary:hover{color:var(--text)}
.words p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:var(--body)}
.add{display:flex;flex-direction:column;gap:12px}
.add-form{display:flex;flex-direction:column;gap:12px}
.add-text{width:100%;min-height:96px;resize:vertical;padding:12px 14px;background:var(--raised);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:10px;font:inherit;font-size:14px}
.add-text:focus{outline:2px solid var(--orange);outline-offset:1px}
.add-hint{font-size:12px;color:var(--dim)}
.add-pics{display:flex;flex-wrap:wrap;gap:8px}.add-pics:empty{display:none}
.add-pics figure{position:relative;margin:0;width:104px;height:78px}
.add-pics img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--hairline)}
.add-pics button{position:absolute;top:2px;right:2px;width:32px;height:32px;background:rgba(5,5,7,.8);border:0;border-radius:50%;font-size:16px;cursor:pointer}
.add-check:empty{display:none}
.add-error{margin:0;font-size:13px;color:#ff8a5c}.add-error:empty{display:none}
.added-note{margin:0;font-size:13px;color:var(--teal)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;background:var(--orange);color:#fff;border:0;border-radius:11px;font:500 13px/1 var(--sans);text-decoration:none;cursor:pointer}
.go:hover{background:#ff6d1f;color:#fff}
.link{appearance:none;background:none;border:0;min-height:44px;padding:0;color:var(--teal);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--text)}
.more{align-self:flex-start;min-height:44px;padding:0 16px;background:var(--raised);border:1px solid var(--hairline);border-radius:10px;font-size:13px;cursor:pointer}
.more:hover{border-color:var(--text)}
.feature{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:var(--card);border:1px solid rgba(47,214,197,.4);border-radius:16px;overflow:hidden}
.feature-text{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;padding:26px}
.feature h2{margin:0;font:600 28px/1.12 var(--display);letter-spacing:-.02em}
.feature p{margin:0;font-size:14px;color:var(--body)}
.live-mark{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.cmp{position:relative;aspect-ratio:16/9;background:var(--raised);overflow:hidden}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cmp-line{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--text);pointer-events:none}
.cmp-knob{position:absolute;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--text);color:var(--ground);pointer-events:none}
.cmp-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.cmp:has(.cmp-range:focus-visible) .cmp-knob{outline:2px solid var(--teal);outline-offset:2px}
.cmp-tag{position:absolute;bottom:12px;padding:6px 8px;background:rgba(5,5,7,.85);border-radius:6px;font:500 10px/1 var(--mono);letter-spacing:.1em;pointer-events:none}
.cmp-tag-l{left:12px}.cmp-tag-r{right:12px}
.card>.cmp{border-radius:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:18px}
.tile{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--hairline);border-radius:16px;overflow:hidden}
.tile-text{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px 20px 20px}
.tile h3{margin:0;font:600 18px/1.25 var(--display)}
.tile-date{font:400 11px/1 var(--mono);color:var(--dim)}
.panel{display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:620px;padding:30px;background:var(--card);border:1px solid var(--hairline);border-radius:16px}
.panel h2{margin:0;font:600 26px/1.15 var(--display);letter-spacing:-.015em}
.panel p{margin:0 0 6px;color:var(--body)}
.toast{position:fixed;left:50%;bottom:20px;z-index:5;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));box-sizing:border-box;padding:14px 18px;background:#15161e;border:1px solid rgba(47,214,197,.45);border-radius:12px;font-size:14px;color:var(--text)}
.strip{padding:13px 18px;background:#0b0c12;border:1px solid var(--hairline);border-radius:12px;font-size:13px;color:var(--body)}
.strip b{font-weight:500;color:var(--teal)}
.foot{margin:0;font:400 11px/1.6 var(--mono);color:var(--dim)}
.skeleton{display:flex;flex-direction:column;gap:14px}
.skeleton div{height:150px;background:var(--card);border:1px solid var(--hairline);border-radius:16px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.card-active .stop-now .dot,.skeleton div{animation:none}}
@media (max-width:820px){
 :root{--gutter:16px}
 .hero{min-height:440px;padding-top:80px;background-position:66% center}
 .home{top:12px}
 .hero p{max-width:285px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .feature{grid-template-columns:minmax(0,1fr)}
 .card{padding:18px 16px}
 .card h3{flex-basis:100%}
 .stop-name{font-size:9px;letter-spacing:.01em}
 .stop-date{font-size:10px}
 .panel{padding:22px 18px}
}
</style>
</head>
<body>
<header class="hero">
 <a class="home" href="walk.html">← Walk around Leo</a>
 <div class="eyebrow">Leo tester crew</div>
 <h1>Builder’s Hub</h1>
 <p>Every idea you send is on its way somewhere. Watch yours go from your first note to something you can walk up to on the ship.</p>
 <div class="who" id="who"></div>
 <div id="hero-stats"></div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="What to show">
 <button class="tab" id="tab-mine" type="button" role="tab" aria-controls="mine">My ideas</button>
 <button class="tab" id="tab-live" type="button" role="tab" aria-controls="live">Just went live</button>
</nav>
<main>
 <div class="view" id="mine" role="tabpanel" aria-labelledby="tab-mine"></div>
 <div class="view" id="live" role="tabpanel" aria-labelledby="tab-live" hidden></div>
</main>
<script>/* BUNDLE */</script>
</body>
</html>
